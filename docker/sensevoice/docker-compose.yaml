services:
  sensevoice:
    image: markgzhou/sensevoice-asr-server:latest
    container_name: sensevoice
    ports:
      - "10085:8000"
    environment:
      - SENSEVOICE_API_KEY=MySuperSafeApiKey
      - SENSEVOICE_TIMEOUT=60
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/docs || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    # If the image supports environment variables for config, add them here.
    # By default, this lightweight image starts a FastAPI server on port 8000.
