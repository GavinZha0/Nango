# FunASR Streaming ASR Server (CPU)
# 
# Start: docker compose -f docker-compose.cpu.yaml up -d
# Stop:  docker compose -f docker-compose.cpu.yaml down
# Logs:  docker compose -f docker-compose.cpu.yaml logs -f funasr
#
# WebSocket URL: ws://localhost:10095
# Note: Initial startup will automatically download models (1-2GB).

services:
  funasr:
    # CPU Image with streaming and offline inference support
    image: registry.cn-hangzhou.aliyuncs.com/funasr_repo/funasr:funasr-runtime-sdk-cpu-0.2.1
    container_name: funasr-streaming-cpu
    ports:
      - "10095:10095"
    volumes:
      # Model cache directory for fast subsequent startups
      - ./funasr-models:/workspace/models
    privileged: true
    restart: unless-stopped

    environment:
      # Fetch models from HuggingFace instead of ModelScope for better global speed
      - HF_ENDPOINT=https://huggingface.co
      - MODELSCOPE_HUB_TYPE=hf
      - FUNASR_MODEL_HUB=hf

    # Start command: 2-pass mode (Online streaming + offline correction)
    # --online-model-dir: Paraformer streaming model
    # --vad-dir: FSMN-VAD voice activity detection
    # --punc-dir: CT-Transformer real-time punctuation
    command: >
      bash -c "export LD_LIBRARY_PATH=/usr/local/lib/python3.8/dist-packages/torch/lib/:$$LD_LIBRARY_PATH && cd /workspace/FunASR/runtime && bash run_server_2pass.sh --download-model-dir /workspace/models --online-model-dir damo/speech_paraformer-large_asr_nat-zh-cn-16k-common-vocab8404-online-onnx --vad-dir damo/speech_fsmn_vad_zh-cn-16k-common-onnx --punc-dir damo/punc_ct-transformer_zh-cn-common-vad_realtime-vocab272727-onnx --certfile 0 && tail -f /dev/null"
