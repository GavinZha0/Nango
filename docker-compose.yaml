name: nango

services:
  nango-app:
    container_name: nango-app
    image: ghcr.io/gavinzha0/nango:latest
    pull_policy: missing
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - path: .env
        required: false
    ports:
      - "${APP_PORT:-9300}:9300"
    environment:
      NO_HTTPS: ${NO_HTTPS:-1}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-dev-secret-change-me-32chars}
      # Nested expansion: if BETTER_AUTH_URL isn't set, derive it from APP_PORT
      # so users only need to change APP_PORT to move the app to a different
      # port.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:9300}
      CREDENTIAL_ENCRYPTION_KEYRING: ${CREDENTIAL_ENCRYPTION_KEYRING:?Set CREDENTIAL_ENCRYPTION_KEYRING in .env or environment (e.g. k1=<64-hex>)}
      CREDENTIAL_ENCRYPTION_ACTIVE_KEY_ID: ${CREDENTIAL_ENCRYPTION_ACTIVE_KEY_ID:?Set CREDENTIAL_ENCRYPTION_ACTIVE_KEY_ID in .env or environment (e.g. k1)}
      # POSTGRES_HOST is hardcoded to the Docker service name.
      # The .env file may set POSTGRES_HOST=localhost for local dev,
      # but inside Docker the DB is always reachable at 'nango-db'.
      POSTGRES_HOST: nango-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-nango}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nango}
      POSTGRES_DB: ${POSTGRES_DB:-nango}
    depends_on:
      nango-db:
        condition: service_healthy
      dify-sandbox:
        condition: service_started
      duckdb-engine:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"http=require('http');req=http.request({host:'127.0.0.1',port:9300,path:'/'},res=>{process.exit(res.statusCode>=200&&res.statusCode<500?0:1)});req.on('error',()=>process.exit(1));req.end()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  nango-db:
    container_name: nango-db
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nango}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nango}
      POSTGRES_DB: ${POSTGRES_DB:-nango}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # PG 18+ uses major-version subdirectories under /var/lib/postgresql
      - nango-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nango}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  dify-sandbox:
    image: langgenius/dify-sandbox:latest
    container_name: dify-sandbox
    restart: unless-stopped
    # ports:
    #   - "8194:8194"
    volumes:
      - ./docker/dify-sandbox/config.yaml:/conf/config.yaml:ro
      - ./docker/dify-sandbox/requirements.txt:/dependencies/python-requirements.txt:ro
      # read only volume mount for shared datasets
      - .cache/datasource/parquet:/var/sandbox/sandbox-python/tmp/data:ro
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined

  duckdb-engine:
    image: ghcr.io/gavinzha0/nango/duckdb-engine:latest
    pull_policy: missing
    container_name: duckdb-engine
    # ports:
    #   - "8526:8526"
    environment:
      - DUCKDB_APIKEY=my-local-duckdb-engine-secret
      - SHARED_CACHE_DIR=/cache/parquet
    volumes:
      - .cache/datasource/parquet:/cache/parquet
    restart: unless-stopped

  sensevoice:
    image: markgzhou/sensevoice-asr-server:latest
    container_name: sensevoice
    # ports:
    #   - "10085:8000"
    environment:
      - SENSEVOICE_API_KEY=MySuperSafeApiKey
      - SENSEVOICE_TIMEOUT=60
    restart: unless-stopped


volumes:
  nango-db-data:

