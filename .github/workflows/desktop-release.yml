name: Desktop Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_desktop:
    name: Build Nango Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
          - os: macos-latest
            platform: darwin
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js standalone bundle and repair .pnpm closure
        run: pnpm desktop:build-standalone

      - name: Fetch bundled Node 24 LTS, Portable PG 18 & DuckDB offline extensions
        run: node desktop/scripts/fetch-binaries.mjs --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}

      - name: Compile Electron main & preload TypeScript to desktop/dist
        run: pnpm desktop:compile

      - name: Run desktop unit and packaging tests
        run: pnpm vitest run tests/unit/desktop/ --test-timeout=60000

      - name: Validate release signing secrets before packaging
        if: startsWith(github.ref, 'refs/tags/v') && vars.NANGO_REQUIRE_SIGNING == 'true'
        shell: bash
        run: |
          echo "Validating release signing credentials for ${{ matrix.platform }}..."
          if [ "${{ matrix.platform }}" = "win32" ]; then
            if [ -z "${{ secrets.CSC_LINK_WIN || secrets.WIN_CSC_LINK || secrets.CSC_LINK }}" ]; then
              echo "::error::Release build on Windows requires CSC_LINK_WIN (or WIN_CSC_LINK) to sign NSIS installer."
              exit 1
            fi
          elif [ "${{ matrix.platform }}" = "darwin" ]; then
            if [ -z "${{ secrets.CSC_LINK_MAC || secrets.MAC_CSC_LINK || secrets.CSC_LINK }}" ]; then
              echo "::error::Release build on macOS requires CSC_LINK_MAC to sign application bundle."
              exit 1
            fi
            if [ -z "${{ secrets.CSC_NAME }}" ] && [ -z "${{ secrets.APPLE_SIGNING_IDENTITY }}" ]; then
              echo "::error::Release build on macOS requires CSC_NAME (or APPLE_SIGNING_IDENTITY) to sign bundled Mach-O binaries in afterSign."
              exit 1
            fi
            if [ -z "${{ secrets.APPLE_ID }}" ] || [ -z "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" ] || [ -z "${{ secrets.APPLE_TEAM_ID }}" ]; then
              echo "::error::Release build on macOS requires APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, and APPLE_TEAM_ID for Notarization."
              exit 1
            fi
          fi

      - name: Package Nango Desktop installer (NSIS / DMG)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NANGO_REQUIRE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/v') && vars.NANGO_REQUIRE_SIGNING == 'true' && 'true' || 'false' }}
          CSC_LINK_WIN_RAW: ${{ secrets.CSC_LINK_WIN || secrets.WIN_CSC_LINK || secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_WIN_RAW: ${{ secrets.CSC_KEY_PASSWORD_WIN || secrets.WIN_CSC_KEY_PASSWORD || secrets.CSC_KEY_PASSWORD }}
          CSC_LINK_MAC_RAW: ${{ secrets.CSC_LINK_MAC || secrets.MAC_CSC_LINK || secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_MAC_RAW: ${{ secrets.CSC_KEY_PASSWORD_MAC || secrets.MAC_CSC_KEY_PASSWORD || secrets.CSC_KEY_PASSWORD }}
          CSC_NAME_RAW: ${{ secrets.CSC_NAME }}
          APPLE_ID_RAW: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_RAW: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_RAW: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "${{ matrix.platform }}" = "win32" ]; then
            if [ -n "$CSC_LINK_WIN_RAW" ]; then
              export CSC_LINK="$CSC_LINK_WIN_RAW"
            fi
            if [ -n "$CSC_KEY_PASSWORD_WIN_RAW" ]; then
              export CSC_KEY_PASSWORD="$CSC_KEY_PASSWORD_WIN_RAW"
            fi
          elif [ "${{ matrix.platform }}" = "darwin" ]; then
            if [ -n "$CSC_LINK_MAC_RAW" ]; then
              export CSC_LINK="$CSC_LINK_MAC_RAW"
            fi
            if [ -n "$CSC_KEY_PASSWORD_MAC_RAW" ]; then
              export CSC_KEY_PASSWORD="$CSC_KEY_PASSWORD_MAC_RAW"
            fi
            if [ -n "$CSC_NAME_RAW" ]; then
              export CSC_NAME="$CSC_NAME_RAW"
            fi
            if [ -n "$APPLE_ID_RAW" ]; then
              export APPLE_ID="$APPLE_ID_RAW"
            fi
            if [ -n "$APPLE_APP_SPECIFIC_PASSWORD_RAW" ]; then
              export APPLE_APP_SPECIFIC_PASSWORD="$APPLE_APP_SPECIFIC_PASSWORD_RAW"
            fi
            if [ -n "$APPLE_TEAM_ID_RAW" ]; then
              export APPLE_TEAM_ID="$APPLE_TEAM_ID_RAW"
            fi
            if [ -z "$CSC_LINK_MAC_RAW" ] && [ -z "$CSC_NAME_RAW" ]; then
              export CSC_IDENTITY_AUTO_DISCOVERY=false
            fi
          fi
          pnpm exec electron-builder --config desktop/electron-builder.yml --${{ matrix.arch }} --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}

      - name: Upload Desktop installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nango-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/desktop/*.exe
            dist/desktop/*.dmg
            dist/desktop/*.zip
            dist/desktop/*.blockmap
            dist/desktop/latest*.yml
          if-no-files-found: error
