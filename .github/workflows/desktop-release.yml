name: Desktop Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_desktop:
    name: Build Nango Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
          - os: macos-latest
            platform: darwin
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js standalone bundle
        env:
          NEXT_STANDALONE_OUTPUT: "true"
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm build

      - name: Repair standalone .pnpm symlink closure and stage runtime assets
        run: node scripts/repair-standalone.mjs

      - name: Fetch bundled Node 24 LTS, Portable PG 18 & DuckDB offline extensions
        run: node desktop/scripts/fetch-binaries.mjs --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}

      - name: Compile Electron main & preload TypeScript to desktop/dist
        run: pnpm desktop:compile

      - name: Run desktop unit and packaging tests
        run: pnpm vitest run tests/unit/desktop/

      - name: Install Electron packaging toolchain
        run: pnpm add -D electron@^35.0.0 electron-builder@^26.0.0

      - name: Validate release signing secrets before packaging
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          echo "Validating release signing credentials for ${{ matrix.platform }}..."
          if [ "${{ matrix.platform }}" = "win32" ]; then
            if [ -z "${{ secrets.CSC_LINK_WIN || secrets.WIN_CSC_LINK || secrets.CSC_LINK }}" ]; then
              echo "::error::Release build on Windows requires CSC_LINK_WIN (or WIN_CSC_LINK) to sign NSIS installer."
              exit 1
            fi
          elif [ "${{ matrix.platform }}" = "darwin" ]; then
            if [ -z "${{ secrets.CSC_LINK_MAC || secrets.MAC_CSC_LINK || secrets.CSC_LINK }}" ] && [ -z "${{ secrets.CSC_NAME }}" ]; then
              echo "::error::Release build on macOS requires CSC_LINK_MAC / CSC_NAME to sign application bundle."
              exit 1
            fi
            if [ -z "${{ secrets.APPLE_ID }}" ] || [ -z "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" ] || [ -z "${{ secrets.APPLE_TEAM_ID }}" ]; then
              echo "::error::Release build on macOS requires APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, and APPLE_TEAM_ID for Notarization."
              exit 1
            fi
          fi

      - name: Package Nango Desktop installer (NSIS / DMG)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NANGO_REQUIRE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
          CSC_LINK: ${{ matrix.platform == 'win32' && (secrets.CSC_LINK_WIN || secrets.WIN_CSC_LINK) || (secrets.CSC_LINK_MAC || secrets.MAC_CSC_LINK || secrets.CSC_LINK) }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'win32' && (secrets.CSC_KEY_PASSWORD_WIN || secrets.WIN_CSC_KEY_PASSWORD) || (secrets.CSC_KEY_PASSWORD_MAC || secrets.MAC_CSC_KEY_PASSWORD || secrets.CSC_KEY_PASSWORD) }}
          CSC_NAME: ${{ secrets.CSC_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm exec electron-builder --config desktop/electron-builder.yml --${{ matrix.arch }} --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}

      - name: Upload Desktop installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nango-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/desktop/*.exe
            dist/desktop/*.dmg
            dist/desktop/*.zip
            dist/desktop/*.blockmap
            dist/desktop/latest*.yml
          if-no-files-found: error
